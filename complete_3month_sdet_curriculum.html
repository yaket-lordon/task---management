
<style>

.wnum{font-size:11px;font-weight:500;padding:2px 9px;border-radius:12px;white-space:nowrap}

.resource-row{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:8px;border-top:0.5px solid var(--color-border-tertiary)}

const taskState = {};
const weekDone = {};

function buildUI() {
  const container = document.getElementById('weeks-container');
  plan.forEach(week => {
    const div = document.createElement('div');
    div.className = `week-block ${week.phase}b`;
    div.id = week.id;
    const phaseClass = week.phase === 'm1' ? 'm1c' : week.phase === 'm2' ? 'm2c' : 'm3c';
    const phaseLabel = week.phase === 'm1' ? 'Month 1' : week.phase === 'm2' ? 'Month 2' : 'Month 3';
    const dotClass = week.phase === 'm1' ? 'm1d' : week.phase === 'm2' ? 'm2d' : 'm3d';
    const weekIdx = plan.indexOf(week);
    div.innerHTML = `
      <div class="week-head" onclick="toggleWeek('${week.id}')">
        <span class="wnum ${phaseClass}">${phaseLabel} · Wk ${weekIdx+1}</span>
        <span class="wtitle">${week.title}</span>
        <span class="wdone" id="done-${week.id}">~${week.hrs}h</span>
        <div class="wcheck" id="wc-${week.id}" onclick="event.stopPropagation();markWeek('${week.id}')">
          <svg class="tick" viewBox="0 0 10 10" fill="none"><polyline points="1.5,5 4,7.5 8.5,2.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
      <div class="week-body" id="body-${week.id}" style="display:none">
        ${week.days.map((d,di) => `
          <div class="day-row">
            <div class="day-label">${d.day}</div>
            <div class="day-content">
              <div class="topic-name">${d.topic}</div>
              <div class="topic-tasks">
                ${d.tasks.map((t,ti) => {
                  const tid = `${week.id}-${di}-${ti}`;
                  return `<div class="task-item" id="ti-${tid}" onclick="toggleTask('${tid}','${dotClass}')">
                    <div class="task-dot" id="td-${tid}" style="background:#B4B2A9"></div>
                    <span>${t}</span>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>
        `).join('')}
        <div class="resource-row">
          <span class="res-label">Resources:</span>
          ${week.resources.map(r => `<span class="res-tag">${r}</span>`).join('')}
        </div>
      </div>`;
    container.appendChild(div);
  });
  updateStats();
}

function toggleWeek(id) {
  const body = document.getElementById('body-'+id);
  body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

function markWeek(id) {
  const wc = document.getElementById('wc-'+id);
  const on = wc.classList.toggle('on');
  weekDone[id] = on;
  updateStats();
}

function toggleTask(tid, dotColor) {
  const el = document.getElementById('ti-'+tid);
  const dot = document.getElementById('td-'+tid);
  const on = el.classList.toggle('tdone');
  taskState[tid] = on;
  dot.style.background = on ? '#1D9E75' : '#B4B2A9';
  updateStats();
}

function updateStats() {
  let totalTasks = 0, doneTasks = 0, doneWeeks = 0;
  plan.forEach(w => {
    if(weekDone[w.id]) doneWeeks++;
    w.days.forEach((d,di) => {
      d.tasks.forEach((t,ti) => {
        totalTasks++;
        if(taskState[`${w.id}-${di}-${ti}`]) doneTasks++;
      });
    });
  });
  document.getElementById('st-topics').textContent = doneTasks;
  document.getElementById('st-weeks').textContent = doneWeeks+'/12';
  const pct = Math.round((doneTasks/totalTasks)*100);
  document.getElementById('st-pct').textContent = pct+'%';
  document.getElementById('pbar').style.width = pct+'%';
}

function filterPhase(phase, btn) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  plan.forEach(w => {
    const el = document.getElementById(w.id);
    el.classList.toggle('hidden', phase !== 'all' && w.phase !== phase);
  });
}

buildUI();
</script>
